<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="foodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#FC8019"/>
    </linearGradient>

    <!-- Savings Green Gradient -->
    <linearGradient id="saveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Badge Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF385C" flood-opacity="0.35"/>
    </filter>

    <filter id="tagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM ICON (Left) -->
  <g transform="translate(15, 10)">
    <!-- Outer Glow Rounded Box -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#foodieGrad)" filter="url(#softGlow)"/>

    <!-- Cloche / Burger Serving Dome Shape -->
    <!-- Dome base line / plate rim -->
    <path d="M 18 72 Q 50 78 82 72 Q 86 78 82 81 Q 50 87 18 81 Q 14 78 18 72 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Food Dome / Smiling Chef Cloche -->
    <path d="M 23 68 C 23 40 40 28 50 28 C 60 28 77 40 77 68 Z" fill="#FFFFFF"/>
    
    <!-- Cloche Top Handle / Spark Knob -->
    <circle cx="50" cy="24" r="6" fill="#FFFFFF"/>
    <circle cx="50" cy="24" r="3.5" fill="#FF5A36"/>

    <!-- The Happy "Foodie" Smile inside the dome -->
    <path d="M 37 50 Q 50 63 63 50" fill="none" stroke="#FF385C" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Happy Foodie Wink Eyes -->
    <circle cx="36" cy="42" r="3.5" fill="#FF385C"/>
    <!-- Wink right eye -->
    <path d="M 60 43 Q 64 39 68 43" fill="none" stroke="#FF385C" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Savings Badge / Discount Tag Overlay (Bottom Right of Icon) -->
    <g transform="translate(62, 58)" filter="url(#tagShadow)">
      <circle cx="18" cy="18" r="18" fill="url(#saveGrad)"/>
      <circle cx="18" cy="18" r="17" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <!-- Rupee / Percentage hybrid symbol -->
      <text x="18" y="24" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹</text>
    </g>

    <!-- Sparkle Stars -->
    <path d="M 15 22 L 17 16 L 23 14 L 17 12 L 15 6 L 13 12 L 7 14 L 13 16 Z" fill="#FFD700"/>
  </g>

  <!-- BRAND TYPOGRAPHY (Right) -->
  <g transform="translate(132, 22)">
    <!-- Main Word: FOODIE -->
    <text x="0" y="50" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#111827">
      Foodie
    </text>

    <!-- Cute Red Tongue / Bite Accent near 'ie' -->
    <circle cx="158" cy="18" r="4" fill="#FF385C"/>

    <!-- Secondary Word Badge: HU MAI! -->
    <g transform="translate(168, 6)">
      <!-- Gradient Rounded Pill Badge -->
      <rect x="0" y="2" width="188" height="50" rx="16" fill="url(#foodieGrad)" filter="url(#softGlow)"/>
      
      <!-- Text: HU MAI! -->
      <text x="94" y="36" font-family="'Outfit', system-ui, sans-serif" font-size="30" font-weight="900" font-style="italic" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
        HU MAI!
      </text>

      <!-- Lightning / Spark Icon inside badge -->
      <path d="M 166 12 L 156 28 L 163 28 L 158 40 L 173 24 L 166 24 Z" fill="#FFEB3B"/>
    </g>

    <!-- Sub-tagline below -->
    <text x="3" y="78" font-family="'Inter', system-ui, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.2" fill="#6B7280">
      ZOMATO • SWIGGY • MAGICPIN <tspan fill="#10B981" font-weight="800">PRICE &amp; COUPON MATCHER</tspan>
    </text>
  </g>
</svg>
