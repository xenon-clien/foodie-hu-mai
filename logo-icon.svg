<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#FC8019"/>
    </linearGradient>

    <linearGradient id="iconEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="iconGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF385C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Base Rounded Container -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#iconBrandGrad)" filter="url(#iconGlow)"/>

    <!-- Steam Waves -->
    <g transform="translate(50, 18)" opacity="0.9">
      <path d="M -16 6 Q -12 0 -16 -6 Q -20 -12 -16 -18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 6 Q 4 0 0 -6 Q -4 -12 0 -18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 16 6 Q 20 0 16 -6 Q 12 -12 16 -18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Food Cloche Base Rim -->
    <path d="M 18 72 Q 50 78 82 72 Q 86 78 82 81 Q 50 87 18 81 Q 14 78 18 72 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Cloche Dome -->
    <path d="M 23 68 C 23 42 38 30 50 30 C 62 30 77 42 77 68 Z" fill="#FFFFFF"/>
    
    <!-- Top Handle Knob -->
    <circle cx="50" cy="25" r="5.5" fill="#FFFFFF"/>
    <circle cx="50" cy="25" r="3" fill="#FF5A36"/>

    <!-- Smile & Wink -->
    <path d="M 38 52 Q 50 63 62 52" fill="none" stroke="#FF385C" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="36" cy="44" r="3" fill="#FF385C"/>
    <path d="M 60 44 Q 63 41 66 44" fill="none" stroke="#FF385C" stroke-width="3" stroke-linecap="round"/>

    <!-- Savings Coin -->
    <g transform="translate(62, 58)">
      <circle cx="18" cy="18" r="18" fill="url(#iconEmeraldGrad)"/>
      <circle cx="18" cy="18" r="16.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <text x="18" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹</text>
    </g>

    <!-- Star -->
    <path d="M 14 20 L 16 14 L 22 12 L 16 10 L 14 4 L 12 10 L 6 12 L 12 14 Z" fill="url(#iconGoldGrad)"/>
  </g>
</svg>
