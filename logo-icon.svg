<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="foodieIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#FC8019"/>
    </linearGradient>
    <linearGradient id="saveIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF385C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="110" height="110" rx="30" fill="url(#foodieIconGrad)" filter="url(#softGlowIcon)"/>

  <!-- Plate Rim -->
  <path d="M 24 82 Q 60 90 96 82 Q 100 89 96 92 Q 60 100 24 92 Q 20 89 24 82 Z" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Food Dome / Cloche -->
  <path d="M 30 78 C 30 45 48 32 60 32 C 72 32 90 45 90 78 Z" fill="#FFFFFF"/>
  
  <!-- Knob -->
  <circle cx="60" cy="27" r="7" fill="#FFFFFF"/>
  <circle cx="60" cy="27" r="4" fill="#FF5A36"/>

  <!-- Smiling face -->
  <path d="M 45 56 Q 60 71 75 56" fill="none" stroke="#FF385C" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="44" cy="46" r="4" fill="#FF385C"/>
  <path d="M 72 47 Q 77 42 82 47" fill="none" stroke="#FF385C" stroke-width="4" stroke-linecap="round"/>

  <!-- Rupee Badge -->
  <g transform="translate(72, 70)">
    <circle cx="18" cy="18" r="18" fill="url(#saveIconGrad)"/>
    <circle cx="18" cy="18" r="17" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <text x="18" y="24" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹</text>
  </g>

  <!-- Sparkle Star -->
  <path d="M 20 28 L 22 22 L 28 20 L 22 18 L 20 12 L 18 18 L 12 20 L 18 22 Z" fill="#FFEB3B"/>
</svg>
